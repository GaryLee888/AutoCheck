name: Wake Up Streamlit Apps

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: List files (除錯用)
        run: ls -R  # 這行會印出檔案列表，幫你確認檔案在哪

      - name: Run ping script
        run: python keep_alive.py
